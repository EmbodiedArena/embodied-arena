task: vsibench2
dataset_path: /your/path/to/embodied-eval-main/embodied_eval/data/vsi-bench-data/vsibench_hf_splits4/part_2
dataset_kwargs:
  video_dir: /your/path/to/embodied-eval-main/embodied_eval/data/vsi-bench-data
load_from_disk: true
eval_split: test
doc_to_visual: !function process.vsibench_doc_to_visual
doc_to_text: !function process.vsibench_doc_to_text
doc_to_target: "ground_truth"
output_type: generate_until
generation_kwargs:
  max_new_tokens: 256
  temperature: 0
  do_sample: false
  top_p: 1.0
  num_beams: 1
# metrics
process_results: !function process.vsibench_process_results
metric_kwargs:
  metric: vsibench_score
  aggregation: !function process.vsibench_aggregate_results
  higher_is_better: true