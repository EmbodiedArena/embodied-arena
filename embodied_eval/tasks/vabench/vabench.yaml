task: vabench
dataset_path: IffYuan/VABench-P
dataset_kwargs:
  pre_prompt: ""
  post_prompt: "Output the point coordinates in JSON format.\nFor example: \n[\n{\"point_2d\": [x, y], \"label\": \"point_1\"}\n]"
  metric_mode: mask
  expected_points: 8
  coord_mode: normalized
  points_mode: fixed
load_from_disk: true
eval_split: test
doc_to_visual: !function process.vabench_doc_to_visual
doc_to_text: !function process.vabench_doc_to_text
doc_to_target: "id"
output_type: generate_until
generation_kwargs:
  max_new_tokens: 2048
  temperature: 0
  do_sample: false
  top_p: 1.0
  num_beams: 1
# metrics
process_results: !function process.vabench_process_results
metric_kwargs:
  metric: accuracy
  aggregation: !function process.vabench_aggregate_results
  higher_is_better: true
