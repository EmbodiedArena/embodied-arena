task: beacon3d-grounding
dataset_path: /data/arena/datasets/Beacon3D/data/scannet/scannet_grounding.json
dataset_kwargs:
  domain: scannet
  point_cloud_dir: /path/to/scannet/scans
load_from_disk: true
doc_to_visual: !function process.beacon3d_grounding_doc_to_visual
doc_to_text: !function process.beacon3d_grounding_doc_to_text
doc_to_target: !function process.beacon3d_grounding_doc_to_target
output_type: generate_until
generation_kwargs:
  max_new_tokens: 128
  temperature: 0.1
  do_sample: true
  top_p: 1.0
  num_beams: 1
# metrics
process_results: !function process.beacon3d_grounding_process_results
metric_kwargs:
  metric: iou_0.5
  aggregation: !function process.beacon3d_grounding_aggregate_results
  higher_is_better: true

