task: ost-bench
dataset_path: /data/arena/datasets/OST-Bench/OST_bench.json
dataset_kwargs:
  image_dir: /data/arena/datasets/OST-Bench/imgs
load_from_disk: true
eval_split: null
doc_to_visual: !function process.ost_bench_doc_to_visual
doc_to_text: !function process.ost_bench_doc_to_text
doc_to_target: !function process.ost_bench_doc_to_target
output_type: generate_until
generation_kwargs:
  max_new_tokens: 256
  temperature: 0.1
  do_sample: true
  top_p: 1.0
  num_beams: 1
process_results: !function process.ost_bench_process_results
metric_kwargs:
  aggregation: !function process.ost_bench_aggregate_results
  higher_is_better: true
