task: where2place-point
dataset_path: /your/path/to/embodied-eval-main/embodied_eval/data/where2place/
dataset_kwargs:
  # Current default: Qwen3-style point output.
  # The evaluator parses JSON-like [{"point_2d": [x, y]}] outputs and treats
  # coordinates as 0-1000 normalized image coordinates.
  backbone: qwen3
  use_kit_prompt: true

  # Previous GPT-style configuration:
  # backbone: gpt
  # use_kit_prompt: false
  # pre_prompt: You are an agent who reasons about free space and spatial relations.
  # post_prompt: Your answer should be formatted as a list of tuples, i.e. [(x1, y1), (x2, y2), ...], where each tuple contains the x and y coordinates of a point satisfying the conditions above. The coordinates should be between 0 and 1, indicating the normalized pixel locations of the points.
load_from_disk: true
eval_split: test
doc_to_visual: !function process.where2place_doc_to_visual
doc_to_text: !function process.where2place_doc_to_text
doc_to_target: "id"
output_type: generate_until
generation_kwargs:
  max_new_tokens: 20480
  temperature: 0
  do_sample: false
  top_p: 1.0
  num_beams: 1
# metrics
process_results: !function process.where2place_process_results
metric_kwargs:
  metric: reference_acc
  aggregation: !function process.where2place_aggregate_results
  higher_is_better: true
